:root{

  box-sizing:border-box;
}

html{
  background:var(--bg);
}

body{
  margin:0;
  font-family:"Archivo", ui-sans-serif, system-ui, sans-serif;
  color:var(--ink);
  background:var(--bg);
}

.app-shell{

  background: radial-gradient(circle at 88% 8%, rgba(240,196,78,.17), transparent 32%), radial-gradient(circle at 8% 90%, rgba(47,125,255,.18), transparent 30%), linear-gradient(180deg,#07162f 0%,#050f22 62%,#040a18 100%);

  letter-spacing:-.04em;
}

.panel{
  background: linear-gradient(160deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
  border:1px solid rgba(255,255,255,.12);
  box-shadow: 0 22px 55px rgba(0,0,0,.28);
  backdrop-filter: blur(8px);
}

.cta{
  background: linear-gradient(180deg,#ffe17c,#f0c44e);
  color:#201500;
  box-shadow:0 12px 28px rgba(240,196,78,.25), inset 0 1px 0 rgba(255,255,255,.7);
}

.cta:hover{
  filter:brightness(1.05);
  transform:translateY(-1px);
}

button:focus-visible{
  outline:2px solid var(--gold);
  outline-offset:2px;
}

@keyframes shake{
  0%,100%{
    transform:translateX(0)
  }

  25%{
    transform:translateX(-5px)
  }

  75%{
    transform:translateX(5px)
  }
}

@keyframes fall{
  0%{
    transform:translateY(-20px) rotate(0deg);
    opacity:1
  }

  100%{
    transform:translateY(560px) rotate(540deg);
    opacity:.25
  }
}

.confetti{
  animation: fall 3s cubic-bezier(.2,.7,.4,1) infinite;
}
